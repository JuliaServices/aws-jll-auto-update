name: Sync and Update AWS Libraries

on:
  #schedule:
  #  - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:
    inputs:
      library:
        description: 'JLL to process (e.g. aws_c_s3). Leave empty to process all.'
        required: false
        type: string
        default: ''
      yggdrasil_repo:
        description: 'Base Yggdrasil repo to open PRs against (owner/Yggdrasil).'
        required: false
        type: string
        default: 'JuliaPackaging/Yggdrasil'

jobs:
  select-libraries:
    runs-on: ubuntu-latest
    outputs:
      library: ${{ steps.select.outputs.library }}
      yggdrasil_repo: ${{ steps.yggdrasil.outputs.yggdrasil_repo }}
      yggdrasil_base: ${{ steps.yggdrasil.outputs.yggdrasil_base }}
    steps:
      - id: select
        env:
          REQUESTED: ${{ inputs.library }}
        run: |
          ALL='["aws_c_auth","aws_c_cal","aws_c_common","aws_c_compression","aws_c_event_stream","aws_c_http","aws_c_http_jq","aws_c_io","aws_c_iot","aws_c_mqtt","aws_c_s3","aws_c_sdkutils","aws_checksums","aws_lc","s2n_tls"]'
          if [[ -z "$REQUESTED" ]]; then
            echo "library=$ALL" >> "$GITHUB_OUTPUT"
          elif echo "$ALL" | jq -e --arg lib "$REQUESTED" 'index($lib) != null' > /dev/null; then
            echo "library=$(jq -cn --arg lib "$REQUESTED" '[$lib]')" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown library '$REQUESTED'. Must be one of: $ALL"
            exit 1
          fi

      - id: yggdrasil
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          YGGDRASIL_REPO: ${{ inputs.yggdrasil_repo }}
        run: |
          YGGDRASIL_REPO="${YGGDRASIL_REPO#"${YGGDRASIL_REPO%%[![:space:]]*}"}"
          YGGDRASIL_REPO="${YGGDRASIL_REPO%"${YGGDRASIL_REPO##*[![:space:]]}"}"
          if [[ -z "$YGGDRASIL_REPO" ]]; then
            YGGDRASIL_REPO="JuliaPackaging/Yggdrasil"
          fi

          repo_re='^[A-Za-z0-9._-]+/Yggdrasil$'
          if [[ ! "$YGGDRASIL_REPO" =~ $repo_re ]]; then
            echo "Invalid yggdrasil_repo '$YGGDRASIL_REPO'. Must match owner/Yggdrasil."
            exit 1
          fi

          YGGDRASIL_BASE=$(gh repo view "$YGGDRASIL_REPO" --json defaultBranchRef --jq .defaultBranchRef.name)
          branch_re='^[A-Za-z0-9._/-]+$'
          if [[ -z "$YGGDRASIL_BASE" || "$YGGDRASIL_BASE" == *..* || ! "$YGGDRASIL_BASE" =~ $branch_re ]]; then
            echo "Invalid default branch '$YGGDRASIL_BASE' for $YGGDRASIL_REPO"
            exit 1
          fi

          echo "Using Yggdrasil repo $YGGDRASIL_REPO (base branch $YGGDRASIL_BASE)"
          echo "yggdrasil_repo=$YGGDRASIL_REPO" >> "$GITHUB_OUTPUT"
          echo "yggdrasil_base=$YGGDRASIL_BASE" >> "$GITHUB_OUTPUT"

  cleanup-merged-branches:
    needs: select-libraries
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT }}
      YGGDRASIL_REPO: ${{ needs.select-libraries.outputs.yggdrasil_repo }}
    steps:
      - name: Delete merged update-versions branches on quinnj2/Yggdrasil
        run: |
          set -euo pipefail

          mapfile -t BRANCHES < <(
            git ls-remote --heads https://github.com/quinnj2/Yggdrasil.git \
              'refs/heads/update-versions-*' \
              | awk '{ sub(/^refs\/heads\//, "", $2); print $2 }' \
              | sort -u
          )

          if [[ ${#BRANCHES[@]} -eq 0 ]]; then
            echo "No update-versions-* branches found on quinnj2/Yggdrasil"
            exit 0
          fi

          echo "Checking ${#BRANCHES[@]} update-versions-* branch(es) for merged PRs against $YGGDRASIL_REPO"
          for BRANCH in "${BRANCHES[@]}"; do
            if [[ ! "$BRANCH" =~ ^update-versions- ]]; then
              echo "Skipping unexpected ref name: $BRANCH"
              continue
            fi

            # Use the REST pulls API with an explicit GET. `gh api -f` without
            # -X GET POSTs to create a PR (and 422s on missing base). Also,
            # `gh pr list --state merged` uses Search where head:owner:branch
            # matches nothing; REST wants owner:branch.
            MERGED_PR=$(gh api -X GET "repos/${YGGDRASIL_REPO}/pulls" \
              -f state=closed \
              -f head="quinnj2:${BRANCH}" \
              --jq '[.[] | select(.merged_at != null) | .html_url] | first // empty')

            if [[ -z "$MERGED_PR" ]]; then
              echo "Keeping $BRANCH (no merged PR)"
              continue
            fi

            echo "Deleting $BRANCH (merged PR: $MERGED_PR)"
            if DELETE_ERR=$(gh api -X DELETE "repos/quinnj2/Yggdrasil/git/refs/heads/${BRANCH}" 2>&1); then
              echo "Deleted $BRANCH"
            elif [[ "$DELETE_ERR" == *"Not Found"* ]] || [[ "$DELETE_ERR" == *"Reference does not exist"* ]]; then
              echo "Branch $BRANCH already absent; continuing"
            else
              echo "Unexpected error deleting $BRANCH:"
              echo "$DELETE_ERR"
              exit 1
            fi
          done

  update-library:
    needs: select-libraries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # Run jobs one at a time to avoid conflicts
      matrix:
        library: ${{ fromJSON(needs.select-libraries.outputs.library) }}

    steps:
    - name: Checkout Yggdrasil repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.select-libraries.outputs.yggdrasil_base }}
        repository: ${{ needs.select-libraries.outputs.yggdrasil_repo }}
        token: ${{ secrets.PAT }}

    - name: Setup Julia
      uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
      with:
        version: '1.10'

    - name: Checkout aws-jll-auto-update repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: JuliaServices/aws-jll-auto-update
        path: jll-dir
        token: ${{ secrets.PAT }}
        ref: main

    - name: compute full repo name
      run: |
        LIBRARY=${{ matrix.library }}
        if [[ "$LIBRARY" == "aws_c_http_jq" ]]; then
          REPO="quinnj/aws-c-http"
        elif [[ "$LIBRARY" == "s2n_tls" ]]; then
          REPO="aws/s2n-tls"
        elif [[ "$LIBRARY" == "aws_lc" ]]; then
          REPO="aws/aws-lc"
        else
          REPO="awslabs/$(echo "$LIBRARY" | tr '_' '-')"
        fi
        echo "REPO=$REPO" >> $GITHUB_ENV

    - name: Compute coverage target from upstream tags
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
      run: |
        LIBRARY=${{ matrix.library }}
        RELEASES=$(curl --retry 5 -L -H "Authorization: token ${{ secrets.PAT }}" \
          "https://api.github.com/repos/${{ env.REPO }}/git/refs/tags")
        echo "$RELEASES" | jq -r '.[] | select(.ref | test("refs/tags/v")) | .ref' \
          | sed 's|refs/tags/v||' | sort -V > /tmp/upstream-versions.txt

        MAX_UPSTREAM_VERSION=$(tail -n 1 /tmp/upstream-versions.txt)
        echo "MAX_UPSTREAM_VERSION=${MAX_UPSTREAM_VERSION}" >> $GITHUB_ENV
        echo "MAX_UPSTREAM_VERSION=$MAX_UPSTREAM_VERSION"

        NEXT_MISSING_EXIT=0
        TARGET_VERSION=$(julia --project=jll-dir jll-dir/jll-version-manager.jl \
          next-missing "${LIBRARY}" /tmp/upstream-versions.txt jll-dir/coverage-baseline.json \
          2> /tmp/coverage-stderr.txt) || NEXT_MISSING_EXIT=$?
        cat /tmp/coverage-stderr.txt
        if [[ $NEXT_MISSING_EXIT -ne 0 ]]; then
          echo "next-missing failed with exit code ${NEXT_MISSING_EXIT}"
          exit "$NEXT_MISSING_EXIT"
        fi
        TARGET_VERSION=$(echo "$TARGET_VERSION" | grep -E '^[0-9]+(\.[0-9]+)+$' | head -n 1 || true)
        TARGET_VERSION=$(echo "$TARGET_VERSION" | tr -d '[:space:]')

        ARTIFICIAL_BUMP=false
        NEED_YGGDRASIL_UPDATE=false

        if [[ -n "$TARGET_VERSION" ]]; then
          TARGET_SHA=$(echo "$RELEASES" | jq -r --arg tag "refs/tags/v${TARGET_VERSION}" \
            '.[] | select(.ref == $tag) | .object.sha')
          if [[ -z "$TARGET_SHA" || "$TARGET_SHA" == "null" ]]; then
            echo "Could not resolve SHA for tag v${TARGET_VERSION}"
            exit 1
          fi
          echo "TARGET_VERSION=${TARGET_VERSION}" >> $GITHUB_ENV
          echo "TARGET_SHA=${TARGET_SHA}" >> $GITHUB_ENV
          echo "Coverage target: TARGET_VERSION=$TARGET_VERSION TARGET_SHA=$TARGET_SHA"
        else
          echo "TARGET_VERSION=" >> $GITHUB_ENV
          echo "TARGET_SHA=" >> $GITHUB_ENV
          echo "No missing upstream versions above coverage baseline"
        fi

        echo "ARTIFICIAL_BUMP=${ARTIFICIAL_BUMP}" >> $GITHUB_ENV
        echo "NEED_YGGDRASIL_UPDATE=${NEED_YGGDRASIL_UPDATE}" >> $GITHUB_ENV

    - name: Parse current version and decide update action
      run: |
        LIBRARY=${{ matrix.library }}
        LIBRARY_DIR=$(echo "${LIBRARY:0:1}" | tr '[:lower:]' '[:upper:]')/${LIBRARY}
        CURRENT_VERSION=$(grep -oP -m 1 '(?<=version = v")[^"]+' $LIBRARY_DIR/build_tarballs.jl | sed 's/^v//')
        echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV
        echo "CURRENT_VERSION=${CURRENT_VERSION}"

        # GitSource may use awslabs/aws-lc even when tags are fetched from aws/aws-lc
        SOURCE_REPO="${{ env.REPO }}"
        if [[ "$LIBRARY" == "aws_lc" ]]; then
          SOURCE_REPO="awslabs/aws-lc"
        fi
        CURRENT_SHA=$(grep -oP -m 1 '(?<=GitSource\("https://github.com/'${SOURCE_REPO//\//\\/}'.git", ")[a-f0-9]{40}' $LIBRARY_DIR/build_tarballs.jl)
        echo "CURRENT_SHA=${CURRENT_SHA}" >> $GITHUB_ENV
        echo "CURRENT_SHA=${CURRENT_SHA}"
        echo "SOURCE_REPO=${SOURCE_REPO}" >> $GITHUB_ENV

        version_gt() {
          if [[ "$1" == "$2" ]]; then
            return 1
          fi
          local highest
          highest=$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)
          [[ "$highest" == "$1" ]]
        }

        ARTIFICIAL_BUMP=false
        NEED_YGGDRASIL_UPDATE=false

        if [[ -n "${TARGET_VERSION}" ]]; then
          if [[ "$CURRENT_VERSION" != "$TARGET_VERSION" ]]; then
            NEED_YGGDRASIL_UPDATE=true
            if version_gt "$CURRENT_VERSION" "$TARGET_VERSION"; then
              echo "Yggdrasil recipe ($CURRENT_VERSION) is ahead of coverage gap $TARGET_VERSION; will backfill"
            else
              echo "Will update Yggdrasil from $CURRENT_VERSION to coverage target $TARGET_VERSION"
            fi
          else
            echo "Yggdrasil recipe already at coverage target $TARGET_VERSION; waiting for register"
          fi
        elif version_gt "$CURRENT_VERSION" "$MAX_UPSTREAM_VERSION"; then
          ARTIFICIAL_BUMP=true
          echo "Coverage complete and current version ${CURRENT_VERSION} is greater than max upstream ${MAX_UPSTREAM_VERSION}. Artificial bump case."
          echo "Will update jll-versions.json with current version ${CURRENT_VERSION} but skip Yggdrasil updates"
        else
          echo "Coverage complete; no Yggdrasil update needed"
        fi

        echo "ARTIFICIAL_BUMP=${ARTIFICIAL_BUMP}" >> $GITHUB_ENV
        echo "NEED_YGGDRASIL_UPDATE=${NEED_YGGDRASIL_UPDATE}" >> $GITHUB_ENV

    - name: Check for existing Yggdrasil PRs for this JLL
      if: env.NEED_YGGDRASIL_UPDATE == 'true'
      env:
        GH_TOKEN: ${{ secrets.PAT }}
        YGGDRASIL_REPO: ${{ needs.select-libraries.outputs.yggdrasil_repo }}
      run: |
        LIBRARY=${{ matrix.library }}
        BRANCH_NAME="update-versions-${LIBRARY}-${TARGET_VERSION}"
        EXISTING_PRS=$(gh pr list --repo "$YGGDRASIL_REPO" --state open \
          --search "[${LIBRARY}] Update to version in:title" \
          --limit 100 \
          --json title,url,headRefName \
          | jq --arg prefix "update-versions-${LIBRARY}-" \
          '[.[] | select(.headRefName | startswith($prefix))]')

        CONFLICTING_PRS=$(echo "$EXISTING_PRS" \
          | jq --arg branch "$BRANCH_NAME" '[.[] | select(.headRefName != $branch)]')
        if [[ "$CONFLICTING_PRS" != "[]" ]]; then
          echo "Open Yggdrasil PR(s) exist for a different ${LIBRARY} version; refusing to create another:"
          echo "$CONFLICTING_PRS" | jq -r '.[] | "- \(.title) (\(.headRefName)): \(.url)"'
          exit 1
        fi

        SAME_TARGET_PR=$(echo "$EXISTING_PRS" \
          | jq --arg branch "$BRANCH_NAME" '[.[] | select(.headRefName == $branch)]')
        if [[ "$SAME_TARGET_PR" != "[]" ]]; then
          echo "Existing PR targets ${LIBRARY} ${TARGET_VERSION}; its branch will be refreshed if needed:"
          echo "$SAME_TARGET_PR" | jq -r '.[] | "- \(.title) (\(.headRefName)): \(.url)"'
        fi

    - name: Sync quinnj2 Yggdrasil fork with upstream
      if: env.NEED_YGGDRASIL_UPDATE == 'true'
      env:
        GH_TOKEN: ${{ secrets.PAT }}
        YGGDRASIL_REPO: ${{ needs.select-libraries.outputs.yggdrasil_repo }}
        YGGDRASIL_BASE: ${{ needs.select-libraries.outputs.yggdrasil_base }}
      run: |
        set -euo pipefail
        if [[ "${YGGDRASIL_REPO,,}" == "quinnj2/yggdrasil" ]]; then
          echo "quinnj2/Yggdrasil is the selected upstream; no fork sync needed"
          exit 0
        fi

        echo "Syncing quinnj2/Yggdrasil from ${YGGDRASIL_REPO}:${YGGDRASIL_BASE}"
        gh repo sync quinnj2/Yggdrasil \
          --source "$YGGDRASIL_REPO" \
          --branch "$YGGDRASIL_BASE"

    - name: Update JLL versions cache
      if: env.NEED_YGGDRASIL_UPDATE == 'true' || env.ARTIFICIAL_BUMP == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
      run: |
        LIBRARY=${{ matrix.library }}

        if [[ "$ARTIFICIAL_BUMP" == "true" ]]; then
          VERSION_TO_UPDATE=$CURRENT_VERSION
          echo "Artificial bump detected. Updating JLL version cache with current version ${VERSION_TO_UPDATE}"
        else
          VERSION_TO_UPDATE=$TARGET_VERSION
          echo "Updating JLL version cache with coverage target ${VERSION_TO_UPDATE}"
        fi

        echo "Updating JLL version cache for ${LIBRARY}_jll to ${VERSION_TO_UPDATE}..."
        cd jll-dir
        julia --project=. jll-version-manager.jl update-version ${LIBRARY} ${VERSION_TO_UPDATE}

        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        if git diff --exit-code jll-versions.json; then
          echo "No changes to JLL versions cache"
        else
          git add jll-versions.json
          git commit -m "Update ${LIBRARY}_jll to ${VERSION_TO_UPDATE}"
          git push
          echo "Updated JLL versions cache"
        fi
        # coverage-baseline.json is intentionally not updated
        cd ..

    - name: Compare versions and update Yggdrasil if necessary
      if: env.NEED_YGGDRASIL_UPDATE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
        YGGDRASIL_BASE: ${{ needs.select-libraries.outputs.yggdrasil_base }}
      run: |
        set -euo pipefail
        LIBRARY=${{ matrix.library }}
        LIBRARY_DIR=$(echo "${LIBRARY:0:1}" | tr '[:lower:]' '[:upper:]')/${LIBRARY}
        BRANCH_NAME="update-versions-$LIBRARY-${TARGET_VERSION}"

        # Update version and SHA (supports both upgrades and backfill downgrades)
        sed -i "s/version = v\"${CURRENT_VERSION}\"/version = v\"${TARGET_VERSION}\"/" $LIBRARY_DIR/build_tarballs.jl
        sed -i "s#${CURRENT_SHA}#${TARGET_SHA}#" $LIBRARY_DIR/build_tarballs.jl

        echo "Updating dependencies for $LIBRARY to mutually compatible versions..."
        DEP_PINS_REPORT="${RUNNER_TEMP}/dep-pins-report-${LIBRARY}.md"
        julia --project=jll-dir jll-dir/jll-version-manager.jl update-deps \
          "$LIBRARY_DIR/build_tarballs.jl" jll-dir/jll-versions.json "$DEP_PINS_REPORT"
        echo "DEP_PINS_REPORT=${DEP_PINS_REPORT}" >> "$GITHUB_ENV"

        # Save the desired recipe, then rebuild the PR branch from the current
        # upstream base. gh repo sync only updates the fork's default branch;
        # reusing a stale feature branch left PRs hundreds of commits behind.
        DESIRED_RECIPE=$(mktemp)
        cp "$LIBRARY_DIR/build_tarballs.jl" "$DESIRED_RECIPE"
        git restore "$LIBRARY_DIR/build_tarballs.jl"

        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'

        git fetch --depth=1 origin "$YGGDRASIL_BASE"
        git checkout -B "$BRANCH_NAME" "origin/$YGGDRASIL_BASE"

        cp "$DESIRED_RECIPE" "$LIBRARY_DIR/build_tarballs.jl"
        git add "$LIBRARY_DIR/build_tarballs.jl"
        if git diff --cached --quiet; then
          echo "Unexpected: coverage target recipe matches $YGGDRASIL_BASE tip"
          exit 1
        fi

        git commit -m "[$LIBRARY] Update to ${TARGET_VERSION} with compatible dependency versions"

        # Rewrite any pre-existing fork branch so the PR is based on current upstream.
        REMOTE_SHA=$(git ls-remote --heads https://github.com/quinnj2/Yggdrasil.git \
          "refs/heads/$BRANCH_NAME" | awk '{print $1}')
        if [[ -n "$REMOTE_SHA" ]]; then
          git push --force-with-lease="refs/heads/$BRANCH_NAME:$REMOTE_SHA" \
            https://github.com/quinnj2/Yggdrasil "HEAD:refs/heads/$BRANCH_NAME"
        else
          git push https://github.com/quinnj2/Yggdrasil "HEAD:refs/heads/$BRANCH_NAME"
        fi
        echo "BRANCH_READY=true" >> "$GITHUB_ENV"

    - name: Checkout fork
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: env.NEED_YGGDRASIL_UPDATE == 'true' && env.BRANCH_READY == 'true'
      with:
        ref: update-versions-${{ matrix.library }}-${{ env.TARGET_VERSION }}
        repository: quinnj2/Yggdrasil
        token: ${{ secrets.PAT }}

    - name: Create or reuse PR
      if: env.NEED_YGGDRASIL_UPDATE == 'true' && env.BRANCH_READY == 'true'
      env:
        GH_TOKEN: ${{ secrets.PAT }}
        YGGDRASIL_REPO: ${{ needs.select-libraries.outputs.yggdrasil_repo }}
        YGGDRASIL_BASE: ${{ needs.select-libraries.outputs.yggdrasil_base }}
      run: |
        BRANCH_NAME="update-versions-${{ matrix.library }}-${TARGET_VERSION}"
        LIBRARY=${{ matrix.library }}

        DEP_PINS_SECTION=""
        if [[ -n "${DEP_PINS_REPORT:-}" && -f "$DEP_PINS_REPORT" ]]; then
          DEP_PINS_SECTION=$(cat "$DEP_PINS_REPORT")
        fi

        PR_BODY=$(printf 'This PR updates %s to version %s.\n\n%s\n\ncc: @Octogonapus' \
          "$LIBRARY" "$TARGET_VERSION" "$DEP_PINS_SECTION")

        EXISTING_PR=$(gh pr list --repo "$YGGDRASIL_REPO" --state open \
          --base "$YGGDRASIL_BASE" \
          --limit 100 \
          --json url,headRefName,headRepositoryOwner \
          | jq -r --arg branch "$BRANCH_NAME" \
            'first(.[] | select(.headRefName == $branch and .headRepositoryOwner.login == "quinnj2") | .url) // empty')

        if [[ -n "$EXISTING_PR" ]]; then
          gh pr edit "$EXISTING_PR" --repo "$YGGDRASIL_REPO" --body "$PR_BODY"
          echo "Updated existing PR: $EXISTING_PR"
          exit 0
        fi

        gh pr create --title "[${LIBRARY}] Update to version ${TARGET_VERSION}" \
          --body "$PR_BODY" \
          --repo "$YGGDRASIL_REPO" --base "$YGGDRASIL_BASE" --head "quinnj2:$BRANCH_NAME"
